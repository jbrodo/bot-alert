[project]
name = "alert-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3,<4",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.3.9,<4",
    "pydantic>=2,<3",
    "python-multipart>=0.0.18,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "djlint>=1.54.2",
    "httpx>=0.28,<1",
    "pre-commit>=4.7.0",
    "pytest>=8,<10",
    "ruff>=0.17.6",
    "ty>=0.0.112",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
