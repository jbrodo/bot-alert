<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% endblock %} · Alert Intelligence</title>
        <link rel="icon" href="data:,">
        <link rel="stylesheet" href="{{ url_for('assets', path='dashboard.css') }}">
    </head>
    <body>
        <header class="topbar">
            <a href="/" class="brand">Alert Intelligence</a>
            <nav class="primary-nav" aria-label="Navigazione principale">
                <a href="/"
                   {% if request.url.path == '/' %}aria-current="page"{% endif %}>Incidenti</a>
                <a href="/notifications"
                   {% if request.url.path == '/notifications' %}aria-current="page"{% endif %}>Notifiche</a>
                <a href="/docs">API</a>
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
