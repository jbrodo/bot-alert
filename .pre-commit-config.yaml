exclude: ^\.agents/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --locked ruff check --fix app tests
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        files: ^(app|tests)/.*\.py$
      - id: ty
        name: ty
        entry: uv run --locked ty check app tests
        language: system
        pass_filenames: false
        always_run: true
      - id: djlint
        name: Format Jinja templates
        entry: uv run --locked djlint --profile jinja --reformat --no-entity-formatting --no-function-formatting --no-set-formatting
        language: system
        files: ^app/web/.*\.html$
      - id: prettier-css
        name: Format CSS
        entry: prettier --write
        language: node
        additional_dependencies: [prettier@3.6.2]
        types: [css]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
